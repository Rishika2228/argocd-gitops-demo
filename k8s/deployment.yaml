apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: gitops-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80